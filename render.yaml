# Blueprint minimo de proposito: quanto menos recursos, menos chance de a
# validacao falhar. Sem bloco `databases` — o banco fica em SQLite efemero,
# recriado a cada partida pelo start.sh. Serve para testar e demonstrar.
services:
  - type: web
    name: administra
    runtime: python
    plan: free
    region: oregon
    branch: claude/stoic-planck-wzsypx
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true          # gerada pelo Render; ninguem digita
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_TIME_ZONE
        value: America/Sao_Paulo
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: ADMIN_EMAIL
        sync: false                  # preenchido na tela de deploy
      - key: ADMIN_SENHA
        sync: false
